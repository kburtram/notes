document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" data-theme=\"{{ theme }}\" data-reduce=\"{{ reduceAttr }}\" style=\"height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:12px;line-height:1.4;overflow:hidden; {{ accentVars }}\">\n\n  <!-- ===================== TOP BAR ===================== -->\n  <header style=\"flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--sidebar-bg);border-bottom:1px solid var(--line);z-index:5\">\n    <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1.5 8h3l1.5-4 3 8 1.5-4h4\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-weight:600;font-size:13px;white-space:nowrap\">MSSQL Debug Console<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- session selector -->\n    <button data-ghost=\"\" onclick=\"{{ act.openProvenance }}\" style=\"display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border:1px solid var(--input-border);border-radius:5px;background:var(--input-bg);color:var(--fg);cursor:pointer;font-family:var(--font-ui);font-size:12px;max-width:340px;min-width:0\">\n      <span data-pulse=\"{{ liveDotAttr }}\" style=\"flex:none;width:8px;height:8px;border-radius:50%;background:{{ sessionDotColor }}\"><\u002Fspan>\n      <span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0\">{{ sessionLabel }}<\u002Fspan>\n      <span style=\"color:var(--muted);font-family:var(--font-mono);font-size:11px;white-space:nowrap\">{{ sessionMeta }}<\u002Fspan>\n      <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n\n    <!-- live / history segmented -->\n    <div style=\"display:fl nt-weight:600;white-space:nowrap\">\n      <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"7\" width=\"9\" height=\"6.5\" rx=\"1.2\"><\u002Frect><path d=\"M5.5 7V5a2.5 2.5 0 015 0v2\"><\u002Fpath><\u002Fsvg>\n      {{ captureLabel }}\n    <\u002Fbutton>\n\n    <!-- gap indicator -->\n    <button data-ghost=\"\" onclick=\"{{ act.goTraceGap }}\" style=\"display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--warn-border);border-radius:5px;background:var(--warn-bg);color:var(--warn);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:600;white-space:nowrap\">\n      <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 1.5l6.5 11.5H1.5z\"><\u002Fpath><path d=\"M8 6.2v3.2M8 11.2v.02\"><\u002Fpath><\u002Fsvg>\n      Backfill {{ gapCount }} gaps\n    <\u002Fbutton>\n\n    <!-- export -->\n    <button data-ghost=\"\" onclick=\"{{ act.openExport }}\" style=\"display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--accent);border-radius:5px;background:var(--accent);color:var(--accent-fg);cursor:pointer;font-family:var(--font-ui);font-size:11px;font-weight:600;white-space:nowrap\">\n      <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v7.5M5.2 6.7L8 9.5l2.8-2.8M3 13.5h10\"><\u002Fpath><\u002Fsvg>\n      Export\n    <\u002Fbutton>\n\n    <!-- theme toggle -->\n    <button data-ghost=\"\" onclick=\"{{ act.toggleTheme }}\" title=\"Toggle theme\" style=\"display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--input-border);border-radius:5px;background:var(--input-bg);colo 2Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.trace }}\" onclick=\"{{ go.trace }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"><path d=\"M6 3.5h8M6 8h8M6 12.5h8\"><\u002Fpath><circle cx=\"2.5\" cy=\"3.5\" r=\"1\"><\u002Fcircle><circle cx=\"2.5\" cy=\"8\" r=\"1\"><\u002Fcircle><circle cx=\"2.5\" cy=\"12.5\" r=\"1\"><\u002Fcircle><\u002Fsvg>Consolidated Trace<\u002Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.waterfall }}\" onclick=\"{{ go.waterfall }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><rect x=\"2\" y=\"2.5\" width=\"7\" height=\"2.6\" rx=\"1.3\"><\u002Frect><rect x=\"5\" y=\"6.7\" width=\"8.5\" height=\"2.6\" rx=\"1.3\"><\u002Frect><rect x=\"3.5\" y=\"10.9\" width=\"5\" height=\"2.6\" rx=\"1.3\"><\u002Frect><\u002Fsvg>Waterfall<\u002Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.perf }}\" onclick=\"{{ go.perf }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 2v12h12\"><\u002Fpath><path d=\"M4 11l3-4 2.5 2 4-6\"><\u002Fpath><\u002Fsvg>Perf &amp; Sessions<\u002Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.completions }}\" onclick=\"{{ go.completions }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\"><path d=\"M8 2l1.4 4L13 7.4 9.4 8.8 8 13l-1.4-4.2L3 7.4 6.6 6z\"><\u002Fpath><\u002Fsvg>Completions<\u002Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.replay }}\" onclick=\"{{ go.replay }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.7 8a5.3 5.3 0 019-3.8M13.3 8a5.3 5.3 0 01-9 3.8\"><\u002Fpath><path d=\"M11.4 1.7v2.7H8.7M4.6 14.3v-2.7h2.7\"><\u002Fpath><\u002Fsvg>Replay Lab<\u002Fbutton>\n\n      <div style=\"padding:12px 14px 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase\">Feature pages<\u002Fdiv>\n      <button data-nav=\"\" data-active=\"{{ nav.sql }}\" onclick=\"{{ go.sql }}\" style=\"display:flex;align-items:center;gap:9px;height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;text-align:left;width:100%\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><ellipse cx=\"8\" cy=\"4\" rx=\"5\" ry=\"2\"><\u002Fellipse><path d=\"M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4\"><\u002Fpath><path d=\"M3 8c0 1.1 2.2 2 5 2s5-.9 5-2\"><\u002Fpath><\u002Fsvg>SQL Activity<\u002Fbutton>\n      <button data-nav=\"\" data-active=\"{{ nav.connections }}\" onclick=\"{{ go.connections }}\" style=\"display:flex;align-
